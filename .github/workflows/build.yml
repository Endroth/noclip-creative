
name: Build CreativeNoclip

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Compilar plugin
        run: mvn --batch-mode clean package

      - name: Disponibilizar JAR
        uses: actions/upload-artifact@v4
        with:
          name: CreativeNoclip
          path: target/*.jar
